[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rimsavexray"
dynamic = ["version"]
description = "See inside your RimWorld save: a read-only report of every byte and every lag-driving count, per section and per mod, with a ranked fix list."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Booyaka101" }]
keywords = ["rimworld", "save", "savefile", "performance", "lag", "profiler", "bloat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Booyaka101/rimsave-xray"
Repository = "https://github.com/Booyaka101/rimsave-xray"
Issues = "https://github.com/Booyaka101/rimsave-xray/issues"
Changelog = "https://github.com/Booyaka101/rimsave-xray/releases"

[project.scripts]
rimsavexray = "rimsavexray.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rimsavexray.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: the 400MB synthetic-save memory/time gate (deselect with '-m \"not slow\"')",
]
